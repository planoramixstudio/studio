<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/studio/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!--
      CSP fallback for static hosting. Prefer setting CSP via HTTP headers in production
      (frame-ancestors / sandbox / report-uri are ignored when delivered via <meta>).
      'wasm-unsafe-eval' is required by web-ifc and pdfjs-dist.
      blob:/data: in img-src and worker-src cover three.js loaders, html-to-image, and pdfjs workers.
      frame-src blob: is required by the Anlage PDF surface, which renders the picked
      file in an <iframe> from a blob: URL; without it default-src blocks the frame
      and Chrome shows "Dieser Inhalt ist blockiert".
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' 'wasm-unsafe-eval';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob:;
        font-src 'self' data:;
        worker-src 'self' blob:;
        frame-src 'self' blob:;
        connect-src 'self' ws: wss: https://*.supabase.co wss://*.supabase.co;
        object-src 'none';
        base-uri 'self';
        form-action 'self';
        frame-ancestors 'self';
        upgrade-insecure-requests
      "
    />
